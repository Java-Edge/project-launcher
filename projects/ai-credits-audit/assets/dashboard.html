<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地 AI 工具积分盘点</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1c212b; --line:#262c38;
    --tx:#e8ecf3; --tx-2:#9aa5b8; --tx-3:#5f6b80;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149; --info:#58a6ff; --purple:#a371f7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:32px 24px 80px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto}
  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  h1{font-size:24px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--tx-2);font-size:13px;margin-top:6px}
  .sub code{font-family:var(--mono);background:var(--panel-2);padding:1px 6px;border-radius:4px}
  .live{text-align:right;font-size:12px;color:var(--tx-3);font-family:var(--mono);white-space:nowrap}
  .live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
    margin-right:6px;vertical-align:0}
  .live.stale .dot{background:var(--danger)}
  .live.loading .dot{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  button{background:var(--panel-2);color:var(--tx-2);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  button:hover{color:var(--tx);border-color:var(--tx-3)}

  h2{font-size:15px;font-weight:600;margin:34px 0 13px;display:flex;align-items:center;gap:9px}
  h2::before{content:"";width:3px;height:15px;background:var(--info);border-radius:2px}
  h2 .n{color:var(--tx-3);font-weight:400;font-size:12px;font-family:var(--mono)}

  .alert{background:linear-gradient(135deg,rgba(248,81,73,.13),rgba(210,153,34,.07));
    border:1px solid rgba(248,81,73,.32);border-left-width:3px;border-radius:8px;
    padding:16px 18px;margin-bottom:24px}
  .alert .t{color:var(--danger);font-weight:650;font-size:14px;margin-bottom:7px}
  .alert .d{color:var(--tx-2);font-size:13px}
  .alert .d b{color:var(--tx);font-family:var(--mono)}
  .alert.ok{background:linear-gradient(135deg,rgba(63,185,80,.10));
    border-color:rgba(63,185,80,.30)}
  .alert.ok .t{color:var(--ok)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 16px}
  .kpi .lb{color:var(--tx-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .kpi .vl{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:7px;letter-spacing:-.02em}
  .kpi .ft{color:var(--tx-3);font-size:11.5px;margin-top:4px}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:13px}
  th{background:var(--panel-2);color:var(--tx-3);font-weight:600;font-size:11.5px;
    text-align:left;padding:9px 13px;letter-spacing:.04em;white-space:nowrap}
  td{padding:10px 13px;border-top:1px solid var(--line);vertical-align:top;
    overflow-wrap:anywhere}
  /* 长 model id / plan 名（zai-individual-coding-plan 等）会把表格撑出横向滚动条 */
  td.mono, td .mono{word-break:break-all}
  tbody tr:hover{background:rgba(255,255,255,.022)}
  .num{font-family:var(--mono);text-align:right;white-space:nowrap}
  th.num{text-align:right}
  .plat{font-weight:550;white-space:nowrap}
  .plat small{display:block;color:var(--tx-3);font-weight:400;font-size:11px;margin-top:2px}
  .tag{display:inline-block;padding:1.5px 7px;border-radius:20px;font-size:11px;
    border:1px solid var(--line);color:var(--tx-2);white-space:nowrap}
  .tag.free{border-color:rgba(88,166,255,.4);color:var(--info)}
  .tag.ok{border-color:rgba(63,185,80,.4);color:var(--ok)}
  .tag.warn{border-color:rgba(210,153,34,.45);color:var(--warn)}
  .tag.dg{border-color:rgba(248,81,73,.4);color:var(--danger)}
  .tag.na{border-color:var(--line);color:var(--tx-3)}
  .note{color:var(--tx-3);font-size:12px;margin-top:3px;line-height:1.5}
  .mono{font-family:var(--mono)}
  .r-danger{color:var(--danger)} .r-warn{color:var(--warn)} .r-ok{color:var(--ok)}
  .r-info{color:var(--info)} .r-purple{color:var(--purple)} .r-dim{color:var(--tx-2)}

  .lgd{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:13px;font-size:12px;color:var(--tx-2);align-items:center}
  .lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .tl{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px 14px}
  .tl-row{display:grid;grid-template-columns:66px 1fr 140px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px}
  .tl-d{font-family:var(--mono);white-space:nowrap}
  .tl-bar{height:20px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden}
  .tl-x{font-family:var(--mono);text-align:right;color:var(--tx-3);white-space:nowrap}
  .tl-x b{color:var(--tx);font-weight:600}
  .tl-axis{display:grid;grid-template-columns:66px 1fr 140px;gap:12px;margin-top:12px;
    padding-top:10px;border-top:1px solid var(--line)}
  .tl-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}

  .cal{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .cal i{width:16px;height:16px;border-radius:3px;background:var(--panel-2);
    border:1px solid var(--line);display:block;cursor:default}
  .cal i.on{background:var(--ok);border-color:var(--ok)}
  .cal i.miss{background:repeating-linear-gradient(45deg,#5a3a12,#5a3a12 3px,#1c212b 3px,#1c212b 6px);border-color:#7a5a1a}
  .cal i.unk{background:#141821;border-color:#1e232e;opacity:.5}
  .cal i.today{outline:2px solid var(--info);outline-offset:1px}
  .cal-cap{width:100%;font-size:11px;color:var(--tx-3);font-family:var(--mono);margin-bottom:3px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  ul.li{list-style:none;font-size:12.5px;color:var(--tx-2);line-height:1.9}
  ul.li b{color:var(--tx);font-weight:550}
  ul.li code{font-family:var(--mono);font-size:11.5px;color:var(--tx-3)}
  footer{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--tx-3);font-size:11.5px;line-height:1.8}
  #err{display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);
    border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:var(--tx-2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>本地 AI 工具积分盘点</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div>
      <div class="live" id="live"><span class="dot"></span><span id="liveTx">…</span></div>
      <div style="margin-top:8px;display:flex;gap:7px;align-items:center">
        <button id="btnCollect">立即采集刷新</button>
        <button id="btnReload">只重读数据</button>
      </div>
    </div>
  </header>

  <div id="err"></div>
  <div id="app"></div>

  <footer id="foot"></footer>
</div>

<script>
const PLATFORM_COLOR = {
  "trae-cn":"var(--info)", "qoder":"var(--purple)",
  "sensetime-raccoon":"#e3b341", "coze":"#ec6cb9", "minimax":"#56d4dd",
  "zcode":"#4c9aff", "autoclaw":"#7d8cff", "bigmodel":"#3fb950"
};
const REFRESH_MS = 5 * 60 * 1000;
let DATA = null, LAST_OK = 0;

const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : Number(n).toLocaleString("zh-CN",{maximumFractionDigits:2});
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const days = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return d; };
const md = s => s.slice(5).replace("-","/");

/* ───────── 从 data.json 推导全部视图 ───────── */

function derive(d){
  const today = d.today;
  const plats = d.platforms;

  // 单位闸门：Trae/Qoder/扣子 是「积分」，ZCode 是「token」。两者绝不能进同一个加总，
  // 否则「可见总积分」和「过期压力比」会被一个 800 万的 token 额度彻底污染。
  const CREDIT_P = p => (p.unit || "credit") === "credit";
  const creditPlats = plats.filter(CREDIT_P);
  const tokenPlats  = plats.filter(p => !CREDIT_P(p));

  // 过期时间线：按 expires 聚合到 (日期 → {platformId: amount})，只收积分平台
  const tlMap = new Map();
  for (const p of creditPlats) for (const g of (p.grants||[])) {
    if (!tlMap.has(g.expires)) tlMap.set(g.expires, {});
    const t = tlMap.get(g.expires);
    t[p.id] = (t[p.id]||0) + g.amount;
  }
  const timeline = [...tlMap.entries()]
    .map(([date, by]) => ({
      date, t: days(today, date), by,
      total: Object.values(by).reduce((s,v)=>s+v,0)
    }))
    .sort((a,b)=>a.t-b.t);

  const withExp = timeline.reduce((s,x)=>s+x.total,0);
  const d7  = timeline.filter(x=>x.t<=7).reduce((s,x)=>s+x.total,0);
  const d30 = timeline.filter(x=>x.t<=30).reduce((s,x)=>s+x.total,0);

  const balances = plats.filter(p=>p.balance!=null);
  const creditBalances = balances.filter(CREDIT_P);
  const totalBal = creditBalances.reduce((s,p)=>s+p.balance,0);
  const totalToken = balances.filter(p=>!CREDIT_P(p)).reduce((s,p)=>s+p.balance,0);

  // 非积分额度池（ZCode 的 token）：单独铺一条时间线，只看最早到期，不并入压力比
  const poolTl = [];
  for (const p of tokenPlats) for (const g of (p.grants||[])) {
    const hit = poolTl.find(x=>x.date===g.expires);
    if (hit) { hit.total += g.amount; hit.rows.push({p, g}); }
    else poolTl.push({ date:g.expires, t: days(today,g.expires), total:g.amount, rows:[{p,g}] });
  }
  poolTl.sort((a,b)=>a.t-b.t);
  const poolSoonest = poolTl[0] || null;

  // 签到
  // 签到三态：true=已签 / false=确认未签 / null=未知（别把「没查」渲染成「未签」）
  const ci = plats.filter(p=>p.checkin && p.checkin.applicable);
  const ciDone = ci.filter(p=>p.checkin.done===true);
  const ciMiss = ci.filter(p=>p.checkin.done===false);
  const ciUnk  = ci.filter(p=>p.checkin.done==null);
  const conflicts = plats.filter(p=>p.confidence==="conflict");

  // 签到日历：滚动 60 天。用连续日期而非自然月，避免跨月时
  // 「月份被最后一条 grant 覆盖」导致整月画错。
  // 签到日历只跟**单一平台**（签到 grant 最多的那个）。
  // 早期版本把所有平台的 checkin grant 取并集，结果另一平台的签到日会把本平台的漏签掩盖掉
  // （Qoder 签了 09-21/09-25 → Trae 的漏签被吞掉，6 天误报成 4 天）。
  const SIGNIN_DAYS = 60;
  const byP = plats.map(p => [p, (p.grants||[]).filter(g => g.kind === "checkin" && g.granted)])
                    .filter(([, g]) => g.length)
                    .sort((a, b) => b[1].length - a[1].length);
  const calSource = byP.length ? byP[0][0] : null;
  const cal = {
    granted: new Set(byP.length ? byP[0][1].map(g => g.granted) : []),
    source: calSource,
    alsoHas: byP.slice(1).map(([p]) => p.name)
  };
  // 注意：不要把局部变量命名为 days —— 会遮蔽模块级的 days(a,b) 日期差函数
  const calDays = [];
  // 只在「有 grants 数据覆盖的区间」内判定漏签。
  // 早于最早发放日的格子是「无数据」，不是漏签 —— 否则回溯窗口一大就全是假漏签。
  const firstGranted = cal.granted.size ? [...cal.granted].sort()[0] : null;
  for (let i = SIGNIN_DAYS - 1; i >= 0; i--){
    const d = addDays(today, -i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const covered = firstGranted ? ds >= firstGranted : false;
    calDays.push({ ds, on: cal.granted.has(ds), isToday: i === 0,
                   state: cal.granted.has(ds) ? "on" : covered ? "miss" : "unk" });
  }
  const missedDays = calDays.filter(x => x.state === "miss");
  const coveredDays = calDays.filter(x => x.state !== "unk").length;

  return { plats, creditPlats, tokenPlats, timeline, withExp, d7, d30,
           balances, totalBal, totalToken, poolTl, poolSoonest,
           ci, ciDone, ciMiss, ciUnk, conflicts, missed: missedDays, cal, calDays,
           firstGranted, coveredDays };
}

/* ───────── 渲染 ───────── */

function render(d){
  const v = derive(d);
  const pressure = v.withExp ? (v.d30 / v.withExp * 100) : 0;
  const nearest = v.timeline[0];

  // token 额度池过期比积分更硬：ZCode 的 Start Plan 到期即额度归零，没有顺延
  const poolSoon = v.poolSoonest;
  const poolAlert = poolSoon ? `
    <div class="alert" style="background:rgba(76,154,255,.09);border-color:rgba(76,154,255,.32)">
      <div class="t" style="color:#4c9aff">◆ ${poolSoon.t<=0 ? "已到期" : `T+${poolSoon.t} 天后`}有 ${fmt(poolSoon.total)} token 额度池清零</div>
      <div class="d">
        ${poolSoon.rows.map(({p})=>`<b>${p.name}</b>（${p.plan||"—"}）`).join(" + ")}
        计划窗口于 <b>${md(poolSoon.date)}</b> 结束${poolSoon.t<=0?"（已过期）":`（T+${poolSoon.t}）`}。<br>
        这类是 <b>token 额度</b>而非积分，<b>不计入上方过期压力比</b>，也不与其他平台余额相加。
      </div>
    </div>` : "";

  const alert = pressure >= 60 ? `
    <div class="alert">
      <div class="t">⚠ ${pressure.toFixed(1)}% 的积分将在 30 天内过期</div>
      <div class="d">
        有明确到期日的 <b>${fmt(v.withExp)}</b> 分里，<b>${fmt(v.d30)}</b> 分在 30 天内清零，
        其中 <b>${fmt(v.d7)}</b> 分在 7 天内过期。<br>
        ${nearest ? `最紧急：<b>${md(nearest.date)}</b>（T+${nearest.t}）有 <b>${fmt(nearest.total)}</b> 分到期。` : ""}
      </div>
    </div>` : `
    <div class="alert ok">
      <div class="t">✓ 过期压力可控</div>
      <div class="d">30 天内过期 <b>${fmt(v.d30)}</b> / 有到期日额度 <b>${fmt(v.withExp)}</b>（${pressure.toFixed(1)}%）</div>
    </div>`;

  const kpis = [
    ["可见总积分", fmt(v.totalBal), `${v.creditPlats.filter(p=>p.balance!=null).length} 个平台有积分余额 · 单位不同不可横向相加`, "r-info"],
    ["token 额度池", fmt(v.totalToken), v.tokenPlats.filter(p=>p.balance!=null).map(p=>p.name).join(" · ") || "无 · 单独统计，不与积分相加", "#4c9aff"],
    ["30 天内过期", fmt(v.d30), pressure>=60 ? `占有到期日额度 ${pressure.toFixed(1)}%` : `占有到期日额度 ${pressure.toFixed(1)}%`, pressure>=60?"r-danger":"r-ok"],
    ["7 天内过期", fmt(v.d7), nearest ? `最近 T+${nearest.t} · ${md(nearest.date)}` : "无", "r-warn"],
    ["今日已签到", `${v.ciDone.length} / ${v.ci.length}`, v.ciUnk.length ? `${v.ciDone.map(p=>p.name).join(" · ")||"无"} · ${v.ciUnk.length} 个未查` : (v.ciDone.map(p=>p.name).join(" · ") || "无签到机制"), (v.ciMiss.length||v.ciUnk.length)?"r-warn":"r-ok"],
    ["数据冲突", v.conflicts.length, v.conflicts.length?v.conflicts.map(p=>p.name).join(", "):"口径一致", v.conflicts.length?"r-danger":"r-ok"],
  ].map(([lb,vl,ft,c])=>`<div class="kpi"><div class="lb">${lb}</div><div class="vl ${c}">${vl}</div><div class="ft">${ft}</div></div>`).join("");

  // 时间线图例
  const legend = `<div class="lgd">${
    Object.entries(v.creditPlats.filter(p=>p.grants?.length).map(p=>[p.id,p.name])).map(([id,n])=>
      `<span><i style="background:${PLATFORM_COLOR[id]||"#888"}"></i>${n}</span>`).join("")
  }<span style="color:var(--tx-3)">｜日期颜色=紧急度：</span>
  <span><b style="color:var(--danger)">T+3内</b></span>
  <span><b style="color:var(--warn)">T+7内</b></span>
  <span><b style="color:#d29922">T+30内</b></span>
  <span><b style="color:var(--ok)">T+30后</b></span></div>`;

  const maxTot = Math.max(...v.timeline.map(x=>x.total), 1);
  const urg = t => t<=3 ? "var(--danger)" : t<=7 ? "var(--warn)" : t<=30 ? "#d29922" : "var(--ok)";
  const rows = v.timeline.map(x=>{
    let off = 0, segs = "";
    for (const [pid, amt] of Object.entries(x.by)){
      const w = amt/maxTot*100;
      segs += `<div style="position:absolute;left:${off}%;top:0;bottom:0;width:${w}%;background:${PLATFORM_COLOR[pid]||"#888"}"></div>`;
      off += w;
    }
    const names = Object.keys(x.by).map(id=>v.plats.find(p=>p.id===id)?.name).filter(Boolean);
    // 只在积分平台里找带 label 的 bonus —— 否则 token 额度池的 label 会漏进积分时间线
    const bonus = v.creditPlats.flatMap(p=>(p.grants||[]).filter(g=>g.expires===x.date && g.label).map(g=>`${g.label} ${g.amount}`));
    const note = bonus.length ? bonus.join(" · ") : (Object.keys(x.by).length>1 ? names.join(" + ") : "");
    return `<div class="tl-row">
      <div class="tl-d" style="color:${urg(x.t)};font-weight:${x.t<=7?600:400}">${md(x.date)}</div>
      <div class="tl-bar">${segs}</div>
      <div class="tl-x"><b>${fmt(x.total)}</b> 分${note?`<br><span style="font-size:10.5px">${note}</span>`:""}</div>
    </div>`;
  }).join("");
  const axis = `<div class="tl-axis"><div></div>
    <div class="tl-ticks"><span>T+0</span><span>T+7</span><span>T+14</span><span>T+21</span><span>T+31</span></div>
    <div class="tl-x r-dim">共 ${fmt(v.withExp)} 分</div></div>`;

  // 余额总表
  const CONF = {confirmed:["ok","已确认"], stale:["warn","缓存快照"], conflict:["dg","口径冲突"],
                partial:["warn","部分"], pending:["na","未查"]};
  const body = v.creditPlats.map(p=>{
    const near = (p.grants||[]).filter(g=>days(d.today,g.expires)<=30);
    const nearAmt = near.reduce((s,g)=>s+g.amount,0);
    const [cc,ct] = CONF[p.confidence] || ["na",p.confidence||"-"];
    const ci = p.checkin||{};
    const ciCell = ci.applicable!==true ? `<span class="tag na">不适用</span>`
      : ci.done===true ? `<span class="tag ok">✓ ${ci.amount?fmt(ci.amount):"已签"}${ci.extra?" +"+ci.extra:""}</span>`
      : ci.done===false ? `<span class="tag warn">未签</span>`
      : `<span class="tag na">未查</span>`;
    return `<tr>
      <td class="plat">${p.name}<small>${p.bundleId||""}</small></td>
      <td>${p.plan?`<span class="tag ${/免费|体验/.test(p.plan)?"free":""}">${p.plan}</span>`:`<span class="tag na">—</span>`}</td>
      <td class="num" style="font-weight:650;color:${p.balance==null?"var(--tx-3)":"var(--info)"}">${fmt(p.balance)}</td>
      <td class="num">${nearAmt?`<span class="r-warn">${fmt(nearAmt)}</span>`:`<span class="r-dim">—</span>`}</td>
      <td>${near.length?`<span class="r-warn">${md(near.sort((a,b)=>a.expires.localeCompare(b.expires))[0].expires)}</span> <span class="r-dim">(T+${days(d.today,near.sort((a,b)=>a.expires.localeCompare(b.expires))[0].expires)})</span>`:`<span class="r-dim">—</span>`}</td>
      <td>${ciCell}</td>
      <td>${p.balanceBreakdown?`<div class="note">${p.balanceBreakdown}</div>`:""}
          ${(p.creditCampaigns||[]).length?`<div class="note" style="margin-top:6px"><b style="color:var(--tx-2)">积分活动（实测自 promotion-config）</b><ul style="margin:3px 0 0 14px;padding:0">${
            p.creditCampaigns.map(c=>`<li>${c.status?`<b class="r-ok">${c.status}</b> `:""}<b>${c.name}</b> — ${c.rule}${c.expiryDays?` <span class="r-warn">（有效期 ${c.expiryDays} 天）</span>`:""}</li>`).join("")
          }</ul></div>`:""}
          ${p.caveat?`<div class="note r-warn">${p.caveat}</div>`:""}
          ${p.source?`<div class="note mono">来源 ${p.source} · <span class="tag ${cc}">${ct}</span></div>`:""}</td>
    </tr>`;
  }).join("");

  // token 额度池：单独一块，不进上方积分时间线
  const poolHtml = v.poolTl.length ? `
    <h2>token 额度池 <span class="n">与积分分开统计 · 不计入过期压力比</span></h2>
    <table>
      <thead><tr><th>平台 / 计划</th><th>额度构成</th><th class="num">合计</th><th>重置周期</th><th>计划窗口结束</th><th>说明</th></tr></thead>
      <tbody>${v.poolTl.map(x=>x.rows.map(({p,g},i)=>{
        const unit = g.unit || p.unit || "token";
        const wins = (p.quotaWindows||[]);
        return `<tr>
          <td class="plat">${i===0?`<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${PLATFORM_COLOR[p.id]||"#888"};margin-right:5px"></i>${p.name}<small>${p.bundleId||""}</small>`:""}</td>
          <td>${wins.length?wins.map(w=>`${w.model} <b class="mono">${fmt(w.amount)}</b> ${w.unit||unit}`).join("<br>"):`${fmt(g.amount)} ${unit}`}</td>
          <td class="num" style="font-weight:650;color:#4c9aff">${fmt(g.amount)} <span class="r-dim">${unit}</span></td>
          <td><span class="tag free">${wins[0]?.period || "—"}</span></td>
          <td>${g.expires?`<span class="${x.t<=3?"r-warn":x.t<=30?"r-dim":""}" style="${x.t<=3?"font-weight:600":""}">${md(g.expires)}</span> <span class="r-dim">(T+${x.t})</span>`:`<span class="r-dim">—</span>`}</td>
          <td>${p.balanceBreakdown?`<div class="note">${p.balanceBreakdown}</div>`:""}
              ${p.relatedPlans?`<div class="note r-dim">${p.relatedPlans.note}</div><div class="note r-dim">${p.relatedPlans.paidTiers}</div>`:""}
              ${p.caveat?`<div class="note r-warn">${p.caveat}</div>`:""}
              ${p.source?`<div class="note mono">来源 ${p.source} · <span class="tag ${({confirmed:"ok",stale:"warn",conflict:"dg",partial:"warn",pending:"na"})[p.confidence]||"na"}">${({confirmed:"已确认",stale:"缓存快照",conflict:"口径冲突",partial:"部分",pending:"未查"})[p.confidence]||p.confidence||"-"}</span></div>`:""}</td>
        </tr>`;
      }).join("")).join("")}</tbody>
    </table>` : "";

  // 滚动签到日历
  const src = v.cal.source;
  const calHtml = v.cal.granted.size ? (()=>{
    const cells = v.calDays.map(x =>
      `<i class="${x.state} ${x.isToday?"today":""}" title="${x.ds} ${{on:"已签",miss:"漏签",unk:"无数据"}[x.state]}"></i>`).join("");
    // 连续漏签段
    const runs = [];
    for (const x of v.missed){
      const last = runs[runs.length-1];
      if (last && days(d.today,x.ds) === days(d.today,last[last.length-1]) + 1) last.push(x.ds);
      else runs.push([x.ds]);
    }
    return `<div class="tl" style="padding-bottom:18px">
      <div class="cal-cap">${src?src.name:"—"} 签到日历 · 绿=已签，斜纹=漏签，灰=无数据，蓝框=今天
        ｜ 数据覆盖 <span class="mono">${v.firstGranted||"—"}</span> 起 ${v.coveredDays} 天，
        已签 <span class="r-ok">${v.cal.granted.size}</span> 天、漏签 <span class="r-warn">${v.missed.length}</span> 天
        ${v.calDays.length>v.coveredDays?`（前 ${v.calDays.length-v.coveredDays} 天早于最早发放日，平台未回溯，不计入漏签）`:""}
        ${v.cal.alsoHas.length?`<br>另有 ${v.cal.alsoHas.join("、")} 也有签到记录，未混入本图（多平台签到日取并集会互相掩盖漏签）`:""}
      </div>
      <div class="cal">${cells}</div>
      <div class="note" style="color:var(--tx-2);margin-top:12px">
        ${v.missed.length
          ? `漏签日：${runs.map(r=>r.length===1?`<span class="mono">${r[0]}</span>`:`<span class="mono">${r[0]} ~ ${r[r.length-1]}</span>（连续 ${r.length} 天）`).join("、")}`
          : "全勤"}
        <br>判定依据：${src ? (src.expiryRule || "—") : "—"}，由到期日反推发放日。若平台注册于 T−60 之内，之前的未签格不代表漏签。
        ${src?.checkin?.evidence?`<br>交叉验证：${src.checkin.evidence}`:""}
      </div>
    </div>`;
  })() : `<div class="note">无可用的签到记录</div>`;

  const na = d.naPlatforms;
  const naList = arr => arr.map(x=>`<li><b>${x.name}</b>${x.bundleId?` <code>${x.bundleId}</code>`:""} — ${x.detail||x.reason}</li>`).join("");

  $("#app").innerHTML = `
    ${poolAlert}
    ${alert}
    <h2>总览 <span class="n">${v.plats.length} 个平台在跟踪 · ${d.meta.appsTotal} 个本地 App</span></h2>
    <div class="kpis">${kpis}</div>

    <h2>即将过期 <span class="n">按到期日升序 · ${d.today} 为 T+0 · 仅积分平台</span></h2>
    ${v.timeline.length ? legend + `<div class="tl">${rows}${axis}</div>` : `<div class="note">无带到期日的积分额度</div>`}

    ${poolHtml}

    <h2>积分余额总表 <span class="n">仅积分平台 · token 额度见上</span></h2>
    <table>
      <thead><tr><th>平台</th><th>套餐</th><th class="num">余额</th><th class="num">30天内到期</th>
        <th>最近到期</th><th>今日签到</th><th>说明</th></tr></thead>
      <tbody>${body}</tbody>
    </table>

    ${v.cal.granted.size ? `<h2>签到日历 <span class="n">最近 ${v.calDays.length} 天 · ${v.cal.source?v.cal.source.name:""} ${v.cal.source?.expiryRule||""}</span></h2>${calHtml}` : ""}

    <h2>无积分体系 <span class="n">订阅制或纯 API Key</span></h2>
    <div class="cols">
      <div><ul class="li"><li style="color:var(--tx-3);margin-bottom:4px">订阅制</ul>${naList(na.subscription)}</ul></div>
      <div><ul class="li"><li style="color:var(--tx-3);margin-bottom:4px">自托管 / API Key</ul>${naList(na.selfhosted)}</ul></div>
    </div>
  `;

  $("#sub").innerHTML = `快照 <code>${d.snapshot.replace("T"," ").slice(0,16)}</code> ·
    本地 App <code>${d.meta.appsTotal}</code>（AI 相关 ${d.meta.appsAiRelated}） · CLI <code>${d.meta.cliTotal}</code> ·
    数据源 ${d.meta.source}`;

  $("#foot").innerHTML = `<b>方法论与局限</b><br>` +
    d.meta.limitations.map((s,i)=>`${i+1}. ${s}`).join("<br>") +
    `<br>4. 本页由 <code>data/credits.json</code> 驱动，过期时间线、压力比、漏签日历全部实时推导 —— 加平台只改 JSON 一处。`;
}

/* ───────── 数据加载 + 自动刷新 ───────── */

function setLive(cls, tx){ $("#live").className = "live "+cls; $("#liveTx").textContent = tx; }

/* 数据文件位置：页面在 assets/ 下，JSON 在 ../data/。
   两种候选都试，这样页面放根目录或 assets/ 下都能用。 */
// 注意：页面在 /assets/ 下，相对路径会解析成 /assets/data/...，必须用根绝对路径
const DATA_PATHS = ["/data/credits.json", "../data/credits.json", "data/credits.json"];

async function fetchData(){
  let lastErr;
  for (const p of DATA_PATHS){
    try{
      const r = await fetch(`${p}?t=${Date.now()}`, {cache:"no-store"});
      if (!r.ok) { lastErr = new Error(p+" → HTTP "+r.status); continue; }
      return await r.json();
    }catch(e){ lastErr = new Error(p+" → "+e.message); }
  }
  throw lastErr || new Error("找不到 credits.json");
}

async function load(first){
  try{
    setLive("loading", "读取中…");
    DATA = await fetchData();
    render(DATA);
    LAST_OK = Date.now();
    const age = Math.round((Date.now()-new Date(DATA.snapshot).getTime())/60000);
    const hours = (age/60).toFixed(1);
    setLive(age > 720 ? "stale" : "", age<60 ? "刚刚更新" : `数据已 ${age<120?age+" 分钟":hours+" 小时"}前采集`);
    if (first) hideErr();
  }catch(e){
    setLive("stale", "读取失败");
    showErr(`<b style="color:var(--danger)">无法读取 credits.json</b>（${e.message}）<br>
      ${location.protocol==="file:"
        ? "浏览器在 <code>file://</code> 下会拦截 fetch。请用本地服务打开：<code>bash scripts/serve.sh</code>"
        : "确认 <code>data/credits.json</code> 存在，且服务根目录是 skill 根（含 assets/ 与 data/）"}`);
  }
}

function showErr(html){ const b=$("#err"); b.style.display="block"; b.innerHTML=html; }
function hideErr(){ $("#err").style.display="none"; }

/* 「立即采集刷新」—— 真正触发 ego-browser 采集，不是只重读 JSON。
   注意：早期版本这个按钮叫「立即刷新」但只重读缓存，名不副实，已拆成两个按钮。 */
async function collect(){
  const btn = $("#btnCollect");
  if (btn.disabled) return;
  btn.disabled = true;
  const old = btn.textContent;
  try{
    setLive("loading","采集中…");
    let phase = "启动中";
    const tick = setInterval(async ()=>{
      try{
        const s = await (await fetch("/api/status",{cache:"no-store"})).json();
        if (s.running && s.phase) phase = s.phase;
        btn.textContent = phase.slice(0,14);
      }catch{}
    }, 1200);

    const r = await fetch("/api/refresh", {method:"POST"});
    clearInterval(tick);
    const j = await r.json();

    if (!j.ok) {
      setLive("stale","采集失败");
      showErr(`<b style="color:var(--danger)">采集失败</b>：${j.error||r.status}<br>
        ${(j.stepsDetail||[]).map(s=>`<code>${s.step}</code> rc=${s.rc}<br>
          <span style="font-size:11px">${(s.err||s.out||"").slice(-400).replace(/\n/g,"<br>")}</span>`).join("<br>")}`);
      return;
    }
    hideErr();
    await load(false);
    const d = j.diff || [];
    if (d.length) {
      const box = document.createElement("div");
      box.className = "alert ok";
      box.style.margin = "0 0 20px";
      box.innerHTML = `<div class="t">✓ 采集完成（${j.elapsedSec}s）· ${d.length} 处变化</div>
        <div class="d">${d.map(x=>`<b>${x.id}</b> ${x.field}：${x.from??"—"} → <b>${x.to??"—"}</b>`).join("　")}</div>`;
      $("#app").insertBefore(box, $("#app").firstChild);
      window.scrollTo({top:0, behavior:"smooth"});
    } else {
      setLive("", "采集完成，数值无变化");
    }
  }catch(e){
    setLive("stale","采集异常");
    showErr(`无法连接采集服务（${e.message}）。服务没起？<br>
      <code>bash "$SKILL/scripts/server.py" 8787</code><br>
      注意 <code>python3 -m http.server</code> 没有 /api/refresh，按钮会失效。`);
  }finally{
    btn.disabled = false;
    btn.textContent = old;
  }
}

$("#btnCollect").onclick = collect;
$("#btnReload").onclick = ()=>load(false);
load(true);
setInterval(()=>{ if(document.visibilityState==="visible") load(false); }, REFRESH_MS);
</script>
